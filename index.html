<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main</title>
</head>
<body>
    <header class="header">
        <h1>
            Chat
        </h1>
    </header>
    <section class="main">
        <div class="list-members">
            <div class="member">
                <img src="" alt="" class="avatar">
                <p class="member-name"></p>
            </div>
        </div>
        <div class="chat">
            <div class="msg">
                <div class="member">
                    <img src="" alt="" class="avatar">
                    <p class="member-name"></p>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="composerContent">
            <div class="composerInput">
                <span class="composerInputMsg" data-placeholder="Сообщение" inputmode="text"></span>
                <div class="composerInputTrigger">
                    <button class="composerInputTriggerSend" aria-label="Отправить Сообщение"></button>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
