<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Main</title>
</head>
<body>
    <header class="header">
        <span>
            Chat
        </span>
        <button>Delete</button>
        <button>Rename</button>
    </header>
    <section class="main">
        <div class="list-members">
            <div class="member">
                <img src="" alt="" class="avatar">
                <span class="member-name">Joil</span>
            </div>
            <div class="member">
                <img src="" alt="" class="avatar">
                <span class="member-name">Joil</span>
            </div>
        </div>
        <div class="chat">
            <div class="msg">
                <div class="member">
                    <img src="" alt="" class="avatar">
                    <p class="member-name">Joil</p>
                </div>
                <div class="msg-text">Hi, everone!</div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="composerContent">
            <div class="composerInput">
                <form class="composerInputMsg" data-placeholder="Сообщение" inputmode="text"></span>
            </div>
            <div class="composerInputTrigger">
                <button class="composerInputTriggerSend">Send</button>
            </div>    
        </div>
    </footer>
</body>
</html>
