<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Main</title>
</head>
<body>
    <header class="header">
        <span>
            Chat
        </span>
        <button>Delete</button>
        <button>Rename</button>
    </header>
    <section class="main">
        <div class="list-members">
            <div class="member">
                <img src="" alt="" class="avatar">
                <span class="member-name">Joil</span>
            </div>
            <div class="member">
                <img src="" alt="" class="avatar">
                <span class="member-name">Joil</span>
            </div>
        </div>
        <div class="chat">
            <div class="msg">
                <img src="" alt="" class="avatar">
                <div class="msg-text">
                    <span class="member-name">Joil</span>
                    <span class="text">Hi, everone!</span>
                </div>
            </div>
            <div class="msg">
                <img src="" alt="" class="avatar">
                <div class="msg-text">
                    <span class="member-name">Joil</span>
                    <span class="text">Hi, everone!</span>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <form class="composerContent">
            <div class="composerInput">
                <input class="composerInputMsg" required placeholder="Сообщение" inputmode="text">
            </div>
            <div class="composerInputTrigger">
                <input class="composerInputTriggerSend">
            </div>    
        </form>
    </footer>
</body>
</html>
